name: MailFlow QA Smoke Tests

on:
  workflow_dispatch:
    inputs:
      authenticated:
        description: Run the authenticated read-only smoke test
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mailflow-qa-smoke
  cancel-in-progress: false

jobs:
  smoke-test:
    name: Run safe MailFlow smoke tests
    runs-on: ubuntu-latest
    env:
      QA_BASE_URL: ${{ secrets.QA_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run public smoke tests
        run: npm run test:qa -- tests/public-smoke.spec.mjs

      - name: Run authenticated read-only smoke test
        if: inputs.authenticated
        env:
          QA_USER_A_EMAIL: ${{ secrets.QA_USER_A_EMAIL }}
          QA_USER_A_PASSWORD: ${{ secrets.QA_USER_A_PASSWORD }}
        run: npm run test:qa -- tests/authenticated-smoke.spec.mjs

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailflow-qa-report-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
