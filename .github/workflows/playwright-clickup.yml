name: Playwright QA and ClickUp Sync

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      clickup_task_id:
        description: ClickUp task ID
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  CLICKUP_TASK_ID: ${{ inputs.clickup_task_id || vars.CLICKUP_TASK_ID }}
  CLICKUP_STARTED_STATUS: ${{ vars.CLICKUP_STARTED_STATUS || 'in progress' }}
  CLICKUP_PASSED_STATUS: ${{ vars.CLICKUP_PASSED_STATUS || 'complete' }}
  CLICKUP_FAILED_STATUS: ${{ vars.CLICKUP_FAILED_STATUS || 'failed' }}

jobs:
  start-clickup:
    name: Mark ClickUp task in progress
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update ClickUp task
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/clickup-sync.mjs start

  playwright:
    name: Run Playwright tests
    if: github.event.action != 'closed'
    needs: start-clickup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        id: tests
        continue-on-error: true
        run: npx playwright test --reporter=html,json,line
        env:
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Package Playwright report for ClickUp
        if: always()
        run: |
          if [ -d playwright-report ]; then
            mkdir -p test-results
            zip -rq test-results/playwright-html-report.zip playwright-report
          else
            echo "No Playwright HTML report was generated; skipping ClickUp attachment."
          fi

      - name: Publish GitHub summary
        if: always()
        run: |
          echo "## Playwright Test Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: ${{ github.repository }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- HTML report: download the \`playwright-html-report-${{ github.run_number }}\` artifact" >> "$GITHUB_STEP_SUMMARY"

      - name: Update ClickUp task
        if: always()
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST_STATUS: ${{ steps.tests.outcome == 'success' && 'passed' || 'failed' }}
        run: node scripts/clickup-sync.mjs finish

      - name: Attach Playwright report to ClickUp task
        if: always() && hashFiles('test-results/playwright-html-report.zip') != ''
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          CLICKUP_ATTACHMENT_PATH: test-results/playwright-html-report.zip
        run: node scripts/clickup-sync.mjs attach

      - name: Comment on pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          TEST_STATUS: ${{ steps.tests.outcome == 'success' && 'PASSED' || 'FAILED' }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- playwright-clickup-report -->';
            const body = [
              marker,
              `## Playwright: ${process.env.TEST_STATUS}`,
              '',
              `Run: ${process.env.RUN_URL}`,
              `Artifact: \`playwright-html-report-${context.runNumber}\``,
              '',
              '_Generated automatically by GitHub Actions._'
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(comment => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Fail workflow when tests fail
        if: steps.tests.outcome != 'success'
        run: exit 1

  notify:
    name: Slack notification
    if: always() && github.event.action != 'closed'
    needs: playwright
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESULT: ${{ needs.playwright.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi

          if [ "$RESULT" = "success" ]; then
            STATUS="PASSED"
            COLOR="#2eb67d"
          else
            STATUS="FAILED"
            COLOR="#e01e5a"
          fi

          payload=$(cat <<EOF
          {"attachments":[{"color":"$COLOR","title":"Playwright tests $STATUS","text":"*Repository:* $GITHUB_REPOSITORY\\n*Branch:* $GITHUB_REF_NAME\\n*ClickUp task:* $CLICKUP_TASK_ID\\n<$RUN_URL|Open GitHub Actions run>","footer":"GitHub Actions"}]}
          EOF
          )
          curl -fsS -X POST -H "Content-Type: application/json" --data "$payload" "$SLACK_WEBHOOK_URL"
